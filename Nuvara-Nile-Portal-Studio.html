<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nuvara Nile — Portal Studio</title><style>*{box-sizing:border-box}body{margin:0;font:14px Arial,sans-serif;color:#172b49;background:#eef1f5}.top{height:58px;background:#10284a;color:white;display:flex;align-items:center;justify-content:space-between;padding:0 20px}.top strong{font:700 20px Georgia,serif}.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.btn{border:1px solid #d5deeb;background:white;color:#10284a;border-radius:5px;padding:9px 12px;font-weight:700;cursor:pointer}.btn.primary{background:#c89a3c;border-color:#c89a3c;color:#fff}.workspace{display:grid;grid-template-columns:1fr 1fr;height:calc(100vh - 58px)}.pane{min-width:0;display:flex;flex-direction:column;background:#fff;border-right:1px solid #d9e0e9}.panehead{height:43px;background:#f8f9fb;border-bottom:1px solid #e2e7ee;padding:0 14px;display:flex;align-items:center;justify-content:space-between;font-weight:700;color:#4a5b72}.panehead small{font-weight:400;color:#8490a0}textarea{border:0;resize:none;outline:none;width:100%;height:100%;padding:16px;font:12px/1.55 Consolas,monospace;color:#24344d;background:#fbfcfe;white-space:pre;tab-size:2}iframe{width:100%;height:100%;border:0;background:white}.empty{height:100%;display:grid;place-items:center;text-align:center;color:#75839a;padding:30px;line-height:1.7}.empty strong{display:block;color:#253c5d;font-size:18px;margin-bottom:8px}@media(max-width:800px){.workspace{grid-template-columns:1fr;grid-template-rows:1fr 1fr;height:calc(100vh - 100px)}.top{height:100px;align-items:flex-start;padding:12px;flex-direction:column}.panehead{height:38px}}
</style></head><body><header class="top"><strong>Nuvara Nile · Portal Studio</strong><div class="tools"><label class="btn" for="file">Upload HTML</label><input id="file" type="file" accept=".html,.htm,text/html" hidden><button class="btn" id="refresh">Refresh preview</button><button class="btn primary" id="download">Download edited HTML</button></div></header><main class="workspace"><section class="pane"><div class="panehead">HTML source <small id="status">Upload Nuvara-Nile-Travel-Portal.html to begin</small></div><textarea id="code" spellcheck="false" placeholder="Upload the portal HTML file to view and edit its source code..."></textarea></section><section class="pane"><div class="panehead">Live preview <small>Updates when you refresh</small></div><div id="empty" class="empty"><div><strong>Preview will appear here</strong>Upload the portal HTML file using the button above.<br>The preview works locally and does not require hosting.</div></div><iframe id="preview" title="Nuvara Nile live preview" hidden></iframe></section></main><script>let fileName='Nuvara-Nile-Travel-Portal.html';const file=document.getElementById('file'),code=document.getElementById('code'),preview=document.getElementById('preview'),empty=document.getElementById('empty'),status=document.getElementById('status');function render(){if(!code.value.trim())return;preview.srcdoc=code.value;preview.hidden=false;empty.hidden=true;status.textContent='Loaded · '+(code.value.length.toLocaleString())+' characters'}file.addEventListener('change',async()=>{const f=file.files&&file.files[0];if(!f)return;fileName=f.name;code.value=await f.text();render()});document.getElementById('refresh').addEventListener('click',render);document.getElementById('download').addEventListener('click',()=>{const blob=new Blob([code.value],{type:'text/html;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=fileName.replace(/\.html?$/i,'')+'-edited.html';a.click();URL.revokeObjectURL(a.href)});code.addEventListener('input',()=>{status.textContent='Edited · refresh preview to apply changes'});</script></body></html>
